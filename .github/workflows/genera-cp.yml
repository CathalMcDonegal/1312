name: Generar Codi Penal 1312

on:
  push:
    paths:
      - "scripts/genera_codi_penal.py"
      - ".github/workflows/genera-cp.yml"
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Instal·lar dependència
        run: python -m pip install beautifulsoup4
      - name: Generar Codi Penal
        run: python scripts/genera_codi_penal.py
      - name: Publicar dades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/codi-penal.json
          if git diff --cached --quiet; then
            echo "No hi ha canvis."
          else
            git commit -m "Actualitza els articles del Codi Penal"
            git push
          fi
