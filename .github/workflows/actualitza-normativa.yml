name: Actualitzar normativa BOE

on:
  push:
    paths:
      - "scripts/genera_normativa.py"
      - ".github/workflows/actualitza-normativa.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualitza:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instal·lar dependència
        run: python -m pip install beautifulsoup4 pypdf

      - name: Generar normativa oficial
        run: python scripts/genera_normativa.py

      - name: Publicar canvis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/normativa-oficial.json
          if git diff --cached --quiet; then
            echo "No hi ha canvis de normativa."
          else
            git commit -m "Actualitza normativa oficial BOE"
            git push
          fi
