name: Traducció automàtica de normativa
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/normativa-oficial.json'
      - 'scripts/tradueix_normativa.py'
jobs:
  tradueix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/tradueix_normativa.py
      - name: Commit traduccions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/normativa-ca.json data/resums-ca.json
          git diff --cached --quiet || git commit -m 'chore: actualitza traduccions de normativa'
          git push
