<!DOCTYPE html><html lang="ca"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2a5b"><meta name="description" content="Actua — guia d’actuació policial pas a pas"><title>Actua</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef3fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e3ebf8;--p:#1d4ed8;--t:#0891b2;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#0a101d;--card:#111a2e;--ink:#e6edf7;--mut:#94a3b8;--line:#1f2c47;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.app{max-width:520px;margin:0 auto}
header{background:linear-gradient(135deg,#0b2a5b,#1d4ed8 62%,#0891b2);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 22px;border-radius:0 0 28px 28px;box-shadow:0 12px 32px rgba(29,78,216,.28)}
.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:1.5rem;box-shadow:0 4px 12px rgba(0,0,0,.2)}
h1{font-size:1.45rem;letter-spacing:-.02em}header p{font-size:.78rem;opacity:.85}
main{padding:16px 14px}
.search{width:100%;border:1px solid var(--line);border-radius:18px;padding:14px 16px;font-size:1rem;background:var(--card);color:var(--ink);box-shadow:0 8px 22px rgba(15,23,42,.08);margin-bottom:14px}
.grid{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 8px 22px rgba(15,23,42,.06)}
button.card{width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer;display:flex;gap:14px;align-items:center}button.card:active{transform:scale(.985)}
.ico{flex:0 0 52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;color:#fff}
.card h3{font-size:1.02rem}.card small{color:var(--mut);font-size:.78rem}
.bar2{height:6px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--t));transition:width .25s}
.back{border:1px solid var(--line);background:var(--card);color:var(--p);border-radius:14px;padding:10px 14px;font-weight:700;margin-bottom:12px;font-size:.85rem}
.steps{list-style:none;padding:0;display:grid;gap:10px;margin:14px 0}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;cursor:pointer}
.step input{width:22px;height:22px;margin-top:2px;accent-color:var(--p);flex:0 0 auto}.step b{display:block;font-size:.92rem}.step span{font-size:.82rem;color:var(--mut)}
.step.done{opacity:.55}.step.done b{text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{background:#dbeafe;color:#1e3a8a;border-radius:999px;padding:4px 10px;font-size:.72rem;font-weight:700}
@media(prefers-color-scheme:dark){.chip{background:#1e3a8a;color:#dbeafe}}
.note{border-left:4px solid var(--warn);background:var(--card);border-radius:0 14px 14px 0;padding:11px 13px;font-size:.82rem;color:var(--mut);margin:12px 0}
h2{font-size:1.2rem;margin:4px 0 6px}label{display:block;font-size:.78rem;font-weight:700;color:var(--mut);margin:10px 0 4px}
input.f,select.f{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;background:var(--bg);color:var(--ink)}
.big{font-size:2rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;font-size:.88rem;color:#fff;background:linear-gradient(135deg,var(--p),var(--t));cursor:pointer}.btn.g{background:var(--card);color:var(--p);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.res{margin-top:12px;padding:12px;border-radius:14px;background:var(--bg);font-size:.88rem}
ol.rights{padding-left:20px;display:grid;gap:9px;font-size:1.02rem}
nav.bar{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0}
nav.bar button{flex:1;border:0;background:none;color:var(--mut);font-size:.7rem;font-weight:700;padding:6px;border-radius:14px}nav.bar button span{display:block;font-size:1.3rem}nav.bar button.on{color:var(--p);background:rgba(29,78,216,.1)}
.foot{font-size:.7rem;color:var(--mut);text-align:center;margin:18px 6px}
</style></head><body><div class="app"><header><div class="brand"><div class="logo">⚖️</div><div><h1>Actua</h1><p>Guia d’actuació pas a pas</p></div></div></header><main id="view"></main>
<nav class="bar"><button data-v="home" class="on"><span>📋</span>Actuacions</button><button data-v="tools"><span>🧰</span>Eines</button><button data-v="info"><span>ℹ️</span>Info</button></nav></div>
<script>
const ACT=[
{id:'detencio',i:'🚔',c:'#1d4ed8',t:'Detenció',s:'Supòsit legal, drets i terminis',refs:['CE art. 17','LECrim art. 490, 492, 520'],steps:[
['Comprova el supòsit legal','Flagrància o un dels casos previstos a la LECrim (arts. 490-492). La detenció ha de ser necessària i proporcionada.'],
['Identifica’t i comunica la detenció','Fes-te reconèixer com a agent i digues clarament que la persona queda detinguda.'],
['Assegura la persona i la zona','Registre superficial per seguretat. Ús mínim de la força i només el necessari.'],
['Informa dels motius i dels drets','Ha de ser immediat i en un llenguatge comprensible. Fes servir la lectura de drets (Eines).'],
['Anota hora i lloc exactes','Marca l’inici de la detenció: el termini màxim de 72 h comença aquí. Activa el cronòmetre (Eines).'],
['Comunica la detenció i sol·licita advocat','Avisa un familiar o persona designada i, si és estranger, el consolat. Sol·licita advocat sense dilació (d’ofici si no en designa).'],
['Reconeixement mèdic','Si ho necessita o ho demana, assegura’l.'],
['Inventari d’efectes personals','Fes-ne constar la relació i que quedi registrada.'],
['Instrueix l’atestat i posa a disposició','Posa la persona en llibertat o a disposició judicial al més aviat possible i, en tot cas, dins del termini màxim legal.']],
avis:'Si és menor de 18 anys, apliquen les regles de la LO 5/2000 (responsabilitat penal dels menors): comunica-ho immediatament a la Fiscalia de Menors.'},
{id:'alcohol',i:'🍺',c:'#0891b2',t:'Alcohol i drogues al volant',s:'Proves, contrast i via penal',refs:['TRLTSV art. 14','RGC arts. 20-28','CP art. 379 i 383'],steps:[
['Requereix la prova','Obligació de sotmetre’s a les proves en control, infracció o accident (art. 14 TRLTSV).'],
['Prova indiciària amb etilòmetre homologat','Aire espirat, boquilla nova i respectant els temps d’espera de l’aparell.'],
['Informa del dret a la prova de contrast','Segona mesura amb un interval mínim de 10 minuts. També es pot sol·licitar anàlisi de sang o orina.'],
['Valora el resultat','Usa la calculadora (Eines): per sobre de 0,60 mg/l hi ha possible delicte (CP art. 379.2).'],
['Si hi ha indicis de delicte','Detenció i atestat segons el procediment (vegeu «Detenció»). Valora la immobilització del vehicle.'],
['Si és infracció administrativa','Formula la denúncia i valora la immobilització segons la normativa.'],
['Drogues','Prova salival indiciària i contrast en laboratori si és positiva. Anota els signes externs observats.'],
['Si es nega a la prova','Informa que la negativa pot ser delicte (CP art. 383) abans de formular l’atestat.'],
['Deixa-ho tot per escrit','Hora, aparell i número de sèrie, resultats, signes (parla, equilibri, halitosi) i manifestacions.']],
avis:'Els límits poden tenir variacions per a professionals i conductors novells. Contrasta-ho amb la normativa vigent.'},
{id:'identificacio',i:'🪪',c:'#7c3aed',t:'Identificació i registre',s:'LO 4/2015: requeriment i escorcoll',refs:['LO 4/2015 art. 16 i 20'],steps:[
['Valora si és necessari','La identificació s’ha de justificar per protegir la seguretat ciutadana o prevenir una infracció.'],
['Identifica’t i explica el motiu','Digues clarament per què el requereixes.'],
['Demana la documentació','DNI, NIE o passaport. Comprova-la.'],
['Si no pot identificar-se','Pots requerir que t’acompanyi a dependències pel temps imprescindible (màxim 6 h) i aixecar diligència. Té dret a avisar un familiar.'],
['Registre corporal extern','Només amb indicis racionals, de manera superficial, proporcionada, per un agent del mateix sexe i en lloc reservat.'],
['Documenta l’actuació','Acta o denúncia si procedeix, amb motiu, hora, lloc i resultat.']],
avis:'Aplica sempre els principis de proporcionalitat, necessitat i respecte a la dignitat de la persona.'},
{id:'accident',i:'🚧',c:'#b45309',t:'Accident de trànsit',s:'Seguretat, auxili i atestat',refs:['TRLTSV (RDL 6/2015)','CP: imprudència i art. 379'],steps:[
['Assegura la zona','Senyalitza i protegeix el lloc per evitar sobreaccidents.'],
['Avalua ferits i demana ajuda','Avisa el 112 / SEM i presta els primers auxilis dins la teva capacitat.'],
['Controla els riscos','Foc, fuites, mercaderies perilloses, vehicles inestables.'],
['Identifica implicats','Conductors, vehicles, assegurances i testimonis.'],
['Proves d’alcohol i drogues','Als conductors implicats (vegeu «Alcohol i drogues al volant»).'],
['Fixa evidències','Fotografies, croquis, marques de frenada, posició final i danys.'],
['Comprova la documentació','Permís, assegurança, ITV i dades dels vehicles.'],
['Instrueix atestat o informe','Atestat si hi ha ferits o presumpte delicte; informe en la resta de casos.'],
['Restableix la circulació','Retira obstacles quan s’hagi acabat la recollida de proves.']],
avis:'Prioritza sempre la vida i la integritat de les persones per sobre de la recollida de proves.'},
{id:'civisme',i:'🏙️',c:'#be185d',t:'Denúncia per Ordenança',s:'Convivència i espai públic',refs:['Ordenança de convivència de Barcelona','LO 4/2015 art. 36'],steps:[
['Constata el fet','Que sigui directament observat per l’agent o provat de manera fefaent.'],
['Identifica la persona','Si cal, aplica el requeriment d’identificació (vegeu «Identificació i registre»).'],
['Requereix el cessament','Explica la infracció i demana que cessi la conducta.'],
['Valora mesures cautelars','Decomís o intervenció de material si ho preveu l’ordenança.'],
['Formula la denúncia','Lloc, data, hora, descripció del fet, precepte infringit i identificació de l’agent.'],
['Informa del procediment','Dret a al·legacions i opcions de pagament segons l’ordenança.'],
['Si hi ha desobediència','Valora si és infracció greu de la LO 4/2015 o delicte (CP art. 556) segons la gravetat.']],
avis:'Comprova l’article exacte i la sanció a la versió vigent de l’Ordenança abans de formular la denúncia.'}
];
const RIGHTS=['Guardar silenci i no declarar si no vols fer-ho.','No declarar contra tu mateix i no confessar-te culpable.','Designar un advocat i ser assistit per ell sense dilació; si no en designes, se’t assignarà un d’ofici.','Accedir als elements essencials de les actuacions per poder impugnar la legalitat de la detenció.','Que es comuniqui la detenció i el lloc de custòdia a un familiar o a la persona que designis.','Que ho sàpiga l’oficina consular, si ets estranger.','Ser assistit per un intèrpret si no entens o no parles la llengua.','Ser reconegut per un metge forense o institució sanitària.','Conèixer el temps màxim de detenció abans de ser posat a disposició judicial.','Sol·licitar el procediment d’habeas corpus.'];
const $=s=>document.querySelector(s),esc=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=v=>String(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let S={checks:{},det:null};try{Object.assign(S,JSON.parse(localStorage.getItem('actua_v1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('actua_v1',JSON.stringify(S))}catch(e){}};
let tab='home',cur=null,tm=null,q='';
const done=a=>(S.checks[a.id]||[]).filter(Boolean).length;
const pad=n=>String(Math.floor(n)).padStart(2,'0');
const hms=ms=>{ms=Math.max(0,ms)/1000;return pad(ms/3600)+':'+pad(ms%3600/60)+':'+pad(ms%60)};
function go(v,id=null){tab=v;cur=id;clearInterval(tm);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(v==='drets'||v==='act'?(v==='act'?'home':'tools'):v)));render();scrollTo(0,0);if(v==='tools'){tick();tm=setInterval(tick,1000)}}
function render(){const m=$('#view');
 if(tab==='home'){const l=ACT.filter(a=>!q||norm(a.t+a.s+a.steps.join(' ')).includes(norm(q)));
  m.innerHTML='<input class="search" id="q" type="search" placeholder="Cerca una actuació: detenció, alcohol…" value="'+esc(q)+'"><div class="grid">'+(l.map(a=>'<button class="card" data-act="'+a.id+'"><div class="ico" style="background:'+a.c+'">'+a.i+'</div><div style="flex:1"><h3>'+a.t+'</h3><small>'+a.s+'</small><div class="bar2"><i style="width:'+done(a)/a.steps.length*100+'%"></i></div></div><small>'+done(a)+'/'+a.steps.length+'</small></button>').join('')||'<div class="card">Cap resultat.</div>')+'</div><p class="foot">Guia orientativa. No substitueix la normativa, els protocols interns ni les instruccions dels superiors.</p>';
  const i=$('#q');i.oninput=()=>{q=i.value;const p=i.selectionStart;render();$('#q').focus();$('#q').setSelectionRange(p,p)}}
 else if(tab==='act'){const a=ACT.find(x=>x.id===cur),c=S.checks[a.id]||[];
  m.innerHTML='<button class="back" data-go="home">← Actuacions</button><h2>'+a.i+' '+a.t+'</h2><small style="color:var(--mut)">'+done(a)+' de '+a.steps.length+' passos</small><div class="bar2"><i style="width:'+done(a)/a.steps.length*100+'%"></i></div><div class="chips">'+a.refs.map(r=>'<span class="chip">'+esc(r)+'</span>').join('')+'</div><ul class="steps">'+a.steps.map((s,k)=>'<li><label class="step'+(c[k]?' done':'')+'" style="margin:0"><input type="checkbox" data-chk="'+k+'"'+(c[k]?' checked':'')+'><div><b>'+(k+1)+'. '+esc(s[0])+'</b><span>'+esc(s[1])+'</span></div></label></li>').join('')+'</ul><div class="note">'+esc(a.avis)+'</div><div class="row"><button class="btn g" data-reset="'+a.id+'">Reinicia els passos</button>'+(a.id==='detencio'?'<button class="btn" data-go="drets">Lectura de drets</button><button class="btn g" data-go="tools">Cronòmetre</button>':'')+(a.id==='alcohol'?'<button class="btn" data-go="tools">Calculadora</button>':'')+'</div>'}
 else if(tab==='drets'){m.innerHTML='<button class="back" data-go="tools">← Eines</button><h2>Lectura de drets</h2><p class="note">Text orientatiu basat en l’art. 520.2 LECrim. Segueix el model oficial del teu cos.</p><div class="card"><p style="font-weight:700;margin-bottom:10px">Tens dret a:</p><ol class="rights">'+RIGHTS.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ol></div>'}
 else if(tab==='tools'){m.innerHTML='<h2>Eines</h2><div class="card"><h3>⏱️ Cronòmetre de detenció</h3><small>Termini màxim: 72 h des de la detenció</small><label for="ds">Inici de la detenció</label><input class="f" id="ds" type="datetime-local"><div class="row"><button class="btn" data-now>Inicia ara</button><button class="btn g" data-clear>Esborra</button></div><div class="res"><div class="big" id="dl">—</div><div id="dt"></div><div class="bar2"><i id="db" style="width:0"></i></div></div></div>'
  +'<div class="card" style="margin-top:12px"><h3>🍺 Calculadora d’alcohol</h3><small>Orientativa: valora sempre el marge de l’aparell i el contrast</small><label for="au">Unitat</label><select class="f" id="au"><option value="a">mg/l en aire espirat</option><option value="s">g/l en sang</option></select><label for="av">Valor mesurat</label><input class="f" id="av" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00"><label><input type="checkbox" id="ap"> Professional o conductor novell</label><div class="res" id="ao">Introdueix un valor.</div></div>'
  +'<div class="card" style="margin-top:12px"><h3>📖 Lectura de drets</h3><small>Text en català per llegir al detingut</small><div class="row"><button class="btn" data-go="drets">Obre la lectura</button></div></div>';
  if(S.det)$('#ds').value=new Date(S.det-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
  $('#ds').onchange=e=>{const t=new Date(e.target.value).getTime();S.det=isNaN(t)?null:t;save();tick()};
  const calc=()=>{const u=$('#au').value,v=parseFloat($('#av').value),p=$('#ap').checked,o=$('#ao');if(isNaN(v)){o.textContent='Introdueix un valor.';return}
   const pen=u==='a'?0.60:1.2,adm=u==='a'?(p?0.15:0.25):(p?0.30:0.50),un=u==='a'?'mg/l':'g/l';
   o.innerHTML=v>pen?'<b class="bad">Possible delicte (CP art. 379.2)</b><br>Supera '+pen.toString().replace('.',',')+' '+un+'. Valora detenció i atestat.':v>adm?'<b class="warn">Infracció administrativa</b><br>Supera el límit de '+adm.toString().replace('.',',')+' '+un+' però no arriba a la via penal pel valor mesurat.':'<b class="ok">Per sota del límit</b><br>Límit aplicable: '+adm.toString().replace('.',',')+' '+un+'. Recorda que també hi pot haver delicte si s’observa afectació de facultats.'};
  ['au','av','ap'].forEach(i=>$('#'+i).oninput=calc)}
 else m.innerHTML='<h2>Info</h2><div class="card"><p><b>Actua</b> és una guia de consulta ràpida d’actuacions policials: passos, referències normatives i eines de suport.</p><p style="margin-top:10px">El progrés dels passos i el cronòmetre es desen només en aquest dispositiu. Funciona sense connexió un cop instal·lada.</p></div><div class="note">Contingut orientatiu. No substitueix el text legal oficial (BOE), els protocols del cos ni les instruccions dels superiors. Verifica sempre la normativa vigent.</div><p class="foot">Versió 1.0</p>'}
function tick(){const l=$('#dl');if(!l)return;const b=$('#db'),t=$('#dt');if(!S.det){l.textContent='—';t.textContent='Sense detenció en curs.';b.style.width='0';return}
 const e=Date.now()-S.det,r=72*36e5-e,p=Math.min(100,e/(72*36e5)*100);l.textContent=hms(e);l.className='big '+(r<=0?'bad':e>48*36e5?'warn':'ok');
 t.innerHTML=r>0?'Resten <b>'+hms(r)+'</b> del màxim de 72 h. Posa a disposició judicial al més aviat possible.':'<b class="bad">Termini màxim de 72 h superat.</b>';b.style.width=p+'%'}
document.addEventListener('click',e=>{const t=e.target,g=t.closest('[data-go]'),a=t.closest('[data-act]'),r=t.closest('[data-reset]'),n=t.closest('[data-now]'),c=t.closest('[data-clear]'),nv=t.closest('nav button');
 if(nv)go(nv.dataset.v);else if(g)go(g.dataset.go);else if(a)go('act',a.dataset.act);
 else if(r){S.checks[r.dataset.reset]=[];save();render()}else if(n){S.det=Date.now();save();render();tick()}else if(c){S.det=null;save();render()}});
document.addEventListener('change',e=>{const k=e.target.dataset.chk;if(k==null)return;const c=S.checks[cur]||(S.checks[cur]=[]);c[+k]=e.target.checked;save();render()});
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
