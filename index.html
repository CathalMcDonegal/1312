<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2a5b">
<meta name="description" content="Actua — guia d’actuació policial pas a pas">
<title>Actua · Guia d’actuació</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef4ff;--card:#fff;--ink:#10203a;--mut:#64748b;--line:#dce7f5;--p:#1746c7;--p2:#0b79b7;--ok:#168447;--warn:#b66a00;--bad:#bd2c36;--shadow:0 10px 28px rgba(15,35,70,.08)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:92px}.app{max-width:620px;margin:auto}
header{background:linear-gradient(135deg,#08265a,#1746c7 58%,#0b91b5);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 22px;border-radius:0 0 30px 30px;box-shadow:0 14px 36px rgba(23,70,199,.28)}.brand{display:flex;align-items:center;gap:13px}.logo{width:50px;height:50px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:1.55rem;box-shadow:0 5px 14px rgba(0,0,0,.2)}h1{font-size:1.45rem;letter-spacing:-.02em}header p{font-size:.8rem;opacity:.9}.badge{display:inline-flex;margin-top:12px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.15);font-size:.72rem;font-weight:800}
main{padding:16px 14px}.search{width:100%;border:1px solid var(--line);border-radius:18px;padding:14px 16px;font-size:1rem;background:var(--card);color:var(--ink);box-shadow:var(--shadow);outline:none}.search:focus{border-color:#5d8cf0;box-shadow:0 0 0 4px rgba(23,70,199,.1),var(--shadow)}
.toolbar{display:flex;gap:8px;overflow:auto;padding:10px 0 4px}.chip{border:1px solid var(--line);background:var(--card);color:var(--p);border-radius:999px;padding:8px 12px;font-weight:800;font-size:.76rem;white-space:nowrap}.chip.active{background:#dce8ff;border-color:#b8cdfb}.section-title{display:flex;justify-content:space-between;align-items:end;margin:18px 2px 9px}.section-title h2{font-size:1.05rem}.section-title small{color:var(--mut)}
.grid{display:grid;gap:11px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:var(--shadow)}button.card{width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer;display:flex;gap:13px;align-items:center}.card:active{transform:scale(.99)}.ico{flex:0 0 50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:1.45rem;color:#fff}.card h3{font-size:1rem}.card p,.mut{color:var(--mut);font-size:.8rem}.refs{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.ref{background:#edf4ff;color:#214a9a;border-radius:999px;padding:3px 8px;font-size:.68rem;font-weight:800}
.detail-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}.back{border:1px solid var(--line);background:var(--card);color:var(--p);border-radius:13px;padding:9px 12px;font-weight:800}.detail-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}.detail-head{display:flex;gap:13px;align-items:center}.detail-head .ico{width:56px;height:56px;flex-basis:56px}.detail h2{font-size:1.35rem;line-height:1.15}.subtitle{color:var(--mut);font-size:.85rem;margin-top:3px}.progress{height:8px;background:#e6edf8;border-radius:99px;overflow:hidden;margin:16px 0 6px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2));transition:width .2s}.progress-label{font-size:.72rem;color:var(--mut)}
.steps{list-style:none;display:grid;gap:9px;margin:14px 0}.step{display:flex;gap:11px;align-items:flex-start;background:#fbfdff;border:1px solid var(--line);border-radius:17px;padding:12px;cursor:pointer}.step input{width:22px;height:22px;margin-top:2px;accent-color:var(--p);flex:0 0 auto}.step b{display:block;font-size:.9rem}.step span{display:block;font-size:.79rem;color:var(--mut);margin-top:2px}.step.done{opacity:.56}.step.done b{text-decoration:line-through}.note{border-left:4px solid var(--warn);background:#fffaf0;border-radius:0 15px 15px 0;padding:11px 13px;font-size:.8rem;color:#70521e;margin:12px 0}.sources{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.sources strong{font-size:.76rem}.sources div{color:var(--mut);font-size:.74rem;margin-top:5px}
.btn{border:0;border-radius:14px;padding:12px 15px;font-weight:850;font-size:.84rem;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));cursor:pointer}.btn.alt{background:var(--card);color:var(--p);border:1px solid var(--line)}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tool-card{margin-bottom:11px}.big{font-size:2rem;font-weight:900;font-variant-numeric:tabular-nums}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}label{display:block;font-size:.76rem;font-weight:800;color:var(--mut);margin:10px 0 4px}input.f{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;background:var(--bg);color:var(--ink)}ol.rights{padding-left:20px;display:grid;gap:9px;font-size:.91rem}.empty{text-align:center;padding:28px 12px;color:var(--mut)}.notice{background:#eaf8f0;border:1px solid #c8ecd8;color:#17683c;border-radius:16px;padding:11px 13px;font-size:.78rem;margin:10px 0}
nav{position:fixed;z-index:10;left:0;right:0;bottom:0;max-width:620px;margin:auto;display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;box-shadow:0 -8px 24px rgba(15,35,70,.07)}nav button{flex:1;border:0;background:none;color:var(--mut);font-size:.69rem;font-weight:800;padding:6px;border-radius:14px}nav button span{display:block;font-size:1.25rem}nav button.on{color:var(--p);background:#eaf1ff}.foot{text-align:center;color:var(--mut);font-size:.68rem;margin:18px 4px}
@media(prefers-color-scheme:dark){:root{--bg:#0a1220;--card:#111c2f;--ink:#e8eef8;--mut:#9aabc2;--line:#243451}.chip.active{background:#1b376b}.ref{background:#19325e;color:#cfe0ff}.step{background:#0f1a2b}.note{background:#292217;color:#e9c98a}nav{background:rgba(17,28,47,.95)}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">⚖️</div><div><h1>Actua</h1><p>Guia d’actuació policial pas a pas</p></div></div><span class="badge">🇨🇦 Tot en català · consulta ràpida</span></header>
<main id="view"></main>
<nav><button data-v="home" class="on"><span>📋</span>Actuacions</button><button data-v="tools"><span>🧰</span>Eines</button><button data-v="info"><span>ℹ️</span>Informació</button></nav>
</div>
<script>
const ACT=[
{id:'detencio',i:'🚔',c:'#1d4ed8',t:'Detenció',s:'Supòsit legal, drets i terminis',refs:['CE art. 17','LECrim arts. 490, 492 i 520'],steps:[['Comprova el supòsit legal','Comprova que existeix un dels supòsits legals de detenció i que la mesura és necessària i proporcionada.'],['Identifica’t i comunica la detenció','Fes-te reconèixer com a agent i comunica clarament que la persona queda detinguda.'],['Assegura la persona i la zona','Prioritza la seguretat. Utilitza només la força imprescindible i proporcionada.'],['Informa dels motius i dels drets','Informa immediatament i amb un llenguatge comprensible. Consulta la lectura de drets a Eines.'],['Anota hora i lloc exactes','Registra l’hora d’inici i controla el termini màxim legal amb el cronòmetre.'],['Comunica la detenció i sol·licita advocat','Fes les comunicacions exigides i garanteix l’assistència lletrada sense dilació.'],['Reconeixement mèdic','Garanteix l’assistència sanitària quan sigui necessària o sol·licitada.'],['Inventari d’efectes personals','Registra els efectes personals i deixa constància de la seva custòdia.'],['Instrueix l’atestat i posa a disposició','Finalitza la detenció tan aviat com sigui possible dins dels terminis legalment aplicables.']],avis:'Si és menor d’edat, aplica les garanties específiques de la normativa de responsabilitat penal del menor i comunica-ho a la Fiscalia de Menors.']},
{id:'alcohol',i:'🍺',c:'#0891b2',t:'Alcohol i drogues al volant',s:'Proves, contrast i via penal',refs:['TRLTSV art. 14','RGC arts. 20-28','CP arts. 379 i 383'],steps:[['Requereix la prova','Quan la normativa ho exigeix, requereix la persona conductora a sotmetre’s a les proves corresponents.'],['Practica la prova d’alcoholèmia','Utilitza un aparell homologat i respecta les instruccions i els temps de mesura.'],['Informa de la prova de contrast','Explica el dret a una prova de contrast en els termes previstos per la normativa.'],['Valora el resultat','Consulta els valors obtinguts i els indicis existents abans de decidir la via administrativa o penal.'],['Si hi ha indicis de delicte','Instrueix les diligències corresponents i valora la detenció o la posada a disposició segons el cas.'],['Drogues','Practica la prova salival i documenta el resultat i, si escau, la prova de confirmació.'],['Si es nega a la prova','Informa de les conseqüències legals de la negativa i deixa constància de la informació facilitada.'],['Deixa-ho tot per escrit','Anota hora, aparell, resultats, signes externs, manifestacions i totes les incidències.']],avis:'Els límits poden variar segons el tipus de conductor i la normativa vigent. Contrasta sempre el règim aplicable abans d’actuar.']},
{id:'identificacio',i:'🪪',c:'#7c3aed',t:'Identificació i registre',s:'Requeriment i escorcoll',refs:['LO 4/2015 arts. 16 i 20'],steps:[['Valora si és necessari','La identificació ha d’estar justificada per les finalitats previstes legalment.'],['Identifica’t i explica el motiu','Comunica de manera clara el motiu del requeriment.'],['Demana la documentació','Sol·licita el document d’identificació que correspongui i comprova les dades.'],['Si no pot identificar-se','Aplica el procediment legal per traslladar la persona a dependències pel temps imprescindible.'],['Registre corporal extern','Només quan concorrin els requisits legals i respectant la dignitat, proporcionalitat i garanties exigibles.'],['Documenta l’actuació','Deixa constància del motiu, lloc, hora, actuació practicada i resultat.']],avis:'Aplica sempre els principis de necessitat, proporcionalitat i respecte a la dignitat de la persona.']},
{id:'accident',i:'🚧',c:'#b45309',t:'Accident de trànsit',s:'Seguretat, auxili i atestat',refs:['TRLTSV','CP: imprudència i seguretat viària'],steps:[['Assegura la zona','Senyalitza i protegeix el lloc per evitar nous accidents.'],['Avalua els ferits i demana ajuda','Avisa el 112 i presta els primers auxilis dins de la teva capacitat.'],['Controla els riscos','Valora foc, fuites, mercaderies perilloses i vehicles inestables.'],['Identifica els implicats','Recull les dades de conductors, vehicles, assegurances i testimonis.'],['Practica les proves necessàries','Alcohol, drogues i altres proves quan legalment correspongui.'],['Fixa les evidències','Fotografies, croquis, marques, posicions finals i danys.'],['Comprova la documentació','Permís, assegurança, ITV i dades dels vehicles.'],['Instrueix l’atestat o informe','Documenta els fets i les diligències practicades segons la naturalesa de l’accident.'],['Restableix la circulació','Retira obstacles quan hagi acabat la recollida d’evidències.']],avis:'La vida i la integritat de les persones tenen prioritat sobre la recollida de proves.']},
{id:'civisme',i:'🏙️',c:'#be185d',t:'Denúncia per ordenança',s:'Convivència i espai públic',refs:['Ordenança de convivència de Barcelona','LO 4/2015'],steps:[['Constata el fet','Descriu una conducta observada directament o acreditada de manera suficient.'],['Identifica la persona','Si és necessari, aplica el procediment legal d’identificació.'],['Requereix el cessament','Explica la conducta i requereix que cessi quan sigui procedent.'],['Valora mesures cautelars','Aplica-les només quan estiguin previstes i siguin necessàries i proporcionades.'],['Formula la denúncia','Indica lloc, data, hora, fets, precepte infringit i dades necessàries.'],['Informa del procediment','Explica les vies d’al·legació i les opcions previstes per la normativa.'],['Si hi ha desobediència','Valora la qualificació administrativa o penal segons la conducta i la seva gravetat.']],avis:'Comprova sempre l’article i la sanció exactes en la versió vigent de l’ordenança abans de formular la denúncia.']}
];
const RIGHTS=['Dret a guardar silenci i a no declarar.','Dret a no declarar contra un mateix i a no confessar-se culpable.','Dret a designar advocat i a ser assistit per ell sense dilació indeguda.','Dret a accedir als elements de les actuacions que siguin essencials per impugnar la legalitat de la detenció.','Dret a comunicar la detenció a un familiar o persona que designi i, si escau, al consolat.','Dret a ser reconegut mèdicament quan correspongui.','Dret a un intèrpret quan sigui necessari per comprendre la situació i exercir els drets.'];
let tab='home',selected=null,searchText='';
const view=document.getElementById('view');
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const key=id=>'actua:'+id;
function render(){if(tab==='home')renderHome();else if(tab==='tools')renderTools();else renderInfo();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));}
function renderHome(){let q=searchText.trim().toLocaleLowerCase('ca');let list=ACT.filter(a=>!q||[a.t,a.s,a.id,...a.refs,...a.steps.flat()].join(' ').toLocaleLowerCase('ca').includes(q));view.innerHTML=`<input id="q" class="search" type="search" placeholder="Cerca una actuació: detenció, alcohol, menors…" value="${esc(searchText)}" autocomplete="off"><div class="toolbar"><button class="chip" data-q="">Totes</button><button class="chip" data-q="detenció">Detenció</button><button class="chip" data-q="alcohol">Alcohol</button><button class="chip" data-q="menors">Menors</button><button class="chip" data-q="domicili">Domicili</button><button class="chip" data-q="atestat">Atestat</button></div><div class="section-title"><h2>${q?'Resultats de la cerca':'Actuacions disponibles'}</h2><small>${list.length} fitxes</small></div><div class="grid">${list.length?list.map(card).join(''):`<div class="card empty">No he trobat cap actuació. Prova amb una altra paraula.</div>`}</div><p class="foot">Contingut orientatiu de consulta. Verifica sempre la normativa vigent i els protocols del teu cos.</p>`;document.getElementById('q').addEventListener('input',e=>{searchText=e.target.value;renderHome();const x=document.getElementById('q');x.focus();x.setSelectionRange(x.value.length,x.value.length)});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{searchText=b.dataset.q;renderHome()});document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>openAction(b.dataset.act));}
function card(a){return `<button class="card" data-act="${a.id}"><div class="ico" style="background:${a.c}">${a.i}</div><div><h3>${esc(a.t)}</h3><p>${esc(a.s)}</p><div class="refs">${a.refs.slice(0,2).map(r=>`<span class="ref">${esc(r)}</span>`).join('')}</div></div></button>`}
function openAction(id){selected=ACT.find(a=>a.id===id);if(!selected)return;tab='detail';renderDetail();history.pushState({actua:id},'',`#${id}`)}
function renderDetail(){let a=selected;if(!a)return renderHome();let done=JSON.parse(localStorage.getItem(key(a.id))||'[]');let pct=Math.round(done.filter(Boolean).length/a.steps.length*100);view.innerHTML=`<div class="detail-top"><button class="back" id="back">← Tornar a les actuacions</button></div><article class="detail-card detail"><div class="detail-head"><div class="ico" style="background:${a.c}">${a.i}</div><div><h2>${esc(a.t)}</h2><div class="subtitle">${esc(a.s)}</div></div></div><div class="progress"><i style="width:${pct}%"></i></div><div class="progress-label">${done.filter(Boolean).length} de ${a.steps.length} passos completats · ${pct}%</div><ol class="steps">${a.steps.map((s,i)=>`<li class="step ${done[i]?'done':''}" data-step="${i}"><input type="checkbox" ${done[i]?'checked':''} aria-label="Pas ${i+1}"><div><b>${i+1}. ${esc(s[0])}</b><span>${esc(s[1])}</span></div></li>`).join('')}</ol><div class="note"><strong>Avís:</strong> ${esc(a.avis)}</div><div class="sources"><strong>Referències</strong><div>${a.refs.map(esc).join(' · ')}</div></div></article><p class="foot">Aquesta fitxa és una guia de consulta i no substitueix la normativa, les instruccions ni els protocols vigents.</p>`;document.getElementById('back').onclick=()=>{history.back()};document.querySelectorAll('[data-step]').forEach(el=>el.onclick=e=>{if(e.target.tagName==='INPUT')e.stopPropagation();let d=JSON.parse(localStorage.getItem(key(a.id))||'[]');let i=+el.dataset.step;d[i]=!d[i];localStorage.setItem(key(a.id),JSON.stringify(d));renderDetail()});}
function renderTools(){view.innerHTML=`<div class="section-title"><h2>Eines de consulta</h2><small>Ràpides i en català</small></div><div class="card tool-card"><h3>⏱️ Cronòmetre de detenció</h3><p class="mut">Control orientatiu del temps transcorregut des de l’hora d’inici.</p><label>Hora d’inici</label><input id="start" class="f" type="datetime-local"><div class="big" id="timer">--:--:--</div><div class="row"><button class="btn" id="now">Posar hora actual</button><button class="btn alt" id="clearStart">Esborrar</button></div></div><div class="card tool-card"><h3>🍺 Calculadora d’alcohol</h3><p class="mut">Eina orientativa per interpretar una taxa mesurada; no calcula una taxa fisiològica.</p><label>Taxa en aire espirat (mg/l)</label><input id="bac" class="f" inputmode="decimal" placeholder="Ex.: 0,40"><div id="bacres" class="res">Introdueix una taxa per veure el rang orientatiu.</div></div><div class="card tool-card"><h3>⚖️ Lectura resumida de drets</h3><ol class="rights">${RIGHTS.map(esc).map(x=>`<li>${x}</li>`).join('')}</ol></div>`;let st=localStorage.getItem('actua:start');if(st)document.getElementById('start').value=st;document.getElementById('now').onclick=()=>{let d=new Date();let z=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);document.getElementById('start').value=z;localStorage.setItem('actua:start',z);tick()};document.getElementById('clearStart').onclick=()=>{localStorage.removeItem('actua:start');document.getElementById('start').value='';tick()};document.getElementById('start').onchange=e=>{localStorage.setItem('actua:start',e.target.value);tick()};document.getElementById('bac').oninput=e=>alcohol(e.target.value);tick();}
function tick(){let el=document.getElementById('timer');if(!el)return;let st=document.getElementById('start').value;if(!st){el.textContent='--:--:--';return}let ms=Math.max(0,Date.now()-new Date(st).getTime());let s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;el.textContent=[h,m,x].map(n=>String(n).padStart(2,'0')).join(':');clearTimeout(window.__tick);window.__tick=setTimeout(tick,1000)}
function alcohol(v){let n=parseFloat(String(v).replace(',','.'));let r=document.getElementById('bacres');if(!r)return;if(!Number.isFinite(n)){r.textContent='Introdueix una taxa vàlida.';return}r.className='res '+(n>0.6?'bad':n>0.25?'warn':'ok');r.innerHTML=n>0.6?'⚠️ Valor que pot entrar en l’àmbit penal segons l’article 379.2 del Codi Penal; comprova totes les circumstàncies.':n>0.25?'ℹ️ Valor per sobre del límit general habitual; comprova el tipus de conductor i el règim aplicable.':'✅ Valor dins del límit general habitual, sense perjudici de la resta de circumstàncies.'}
function renderInfo(){view.innerHTML=`<div class="section-title"><h2>Informació</h2></div><div class="card"><h3>Sobre Actua</h3><p class="mut">Guia de consulta ràpida per ordenar actuacions, comprovar passos i tenir a mà eines bàsiques.</p><div class="notice">Tot el contingut visible de l’aplicació està redactat en català.</div><p class="mut">Les fitxes són orientatives. La normativa pot canviar i els protocols del cos poden establir instruccions específiques.</p></div><div class="card" style="margin-top:11px"><h3>Privacitat</h3><p class="mut">El progrés de les actuacions i l’hora del cronòmetre es guarden localment al dispositiu mitjançant l’emmagatzematge del navegador.</p></div><p class="foot">Actua · guia d’actuació pas a pas</p>`}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.v;selected=null;render();history.pushState({tab},'',location.pathname)});
window.onpopstate=()=>{selected=null;tab='home';render()};
if(location.hash){let a=ACT.find(x=>x.id===location.hash.slice(1));if(a){selected=a;tab='detail'}}
render();
</script>
<script src="js/data-extra.js"></script>
</body></html>
